name: Daily DLD scraper

on:
  schedule:
    # Daily at 02:30 UTC (06:30 Dubai time — well after DLD's nightly batch)
    - cron: "30 2 * * *"
  workflow_dispatch:  # also allow manual trigger from the Actions tab

permissions:
  contents: write  # so the action can commit live-areas.json back

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run scraper
        env:
          # PROXY MODE: scraper calls the Cloudflare Worker (UAE-pinned via
          # Smart Placement), which holds the actual DDA credentials.
          DLD_PROXY_URL:    ${{ secrets.DLD_PROXY_URL }}
          DLD_PROXY_SECRET: ${{ secrets.DLD_PROXY_SECRET }}
          # Entity / dataset names (override here without editing the script)
          DLD_ENTITY:       ${{ vars.DLD_ENTITY }}
          DLD_TX_DATASET:   ${{ vars.DLD_TX_DATASET }}
          DLD_RENT_DATASET: ${{ vars.DLD_RENT_DATASET }}
        run: |
          python3 scripts/scrape-dld.py --output live-areas.json
          echo "--- live-areas.json (head) ---"
          head -40 live-areas.json

      - name: Commit if changed
        run: |
          if git diff --quiet -- live-areas.json; then
            echo "No changes to live-areas.json — skipping commit."
            exit 0
          fi
          git config user.name "exceed-dld-scraper[bot]"
          git config user.email "noreply@exceed-re.ae"
          git add live-areas.json
          git commit -m "auto: refresh live-areas.json from DLD ($(date -u +%Y-%m-%d))

          Source: Dubai Pulse Open Data API. Generated by scripts/scrape-dld.py.

          Co-Authored-By: Claude Opus 4.7 (1M context) <noreply@anthropic.com>"
          git push
